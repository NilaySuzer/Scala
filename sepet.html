<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sepetim</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #e8db4e88;
        margin: 0;
        padding: 0;
      }
      .page-layout {
        display: flex;
        align-items: flex-start; /* ÜSTTEN AYNI HİZA */
      }

      /* Sidebar */
      .sidebar {
        width: 250px;
        background: #7e2714;
        color: #fff;
        height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }

      .sidebar h2 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 22px;
      }

      .sidebar a {
        display: flex;
        padding: 10px 15px;
        margin: 8px 0;
        color: #dcdcdc;
        text-decoration: none;
        font-size: 16px;
        border-radius: 6px;
        transition: 0.3s;
      }

      .sidebar a:hover {
        background: #e8db4e88;
      }

      .cart-container {
        margin-top: 0 !important;
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
        background: transparent;
        padding: 25px;
        border-radius: 12px;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .cart-item {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 20px;
      }

      .cart-item img {
        width: 120px;
        height: 160px;
        border-radius: 6px;
        object-fit: cover;
      }

      .cart-info {
        flex: 1;
      }

      .cart-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .cart-price {
        color: #28a745;
        font-size: 18px;
        margin-bottom: 10px;
      }

      .quantity-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .quantity-controls button {
        background: #7e2714;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
      }

      .quantity-controls button:hover {
        background: #ffffff;
      }

      .remove-btn {
        background: red;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
      }

      .remove-btn:hover {
        background: #ffffff;
      }

      .summary {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
      }

      .summary div {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 18px;
      }

      .checkout-btn {
        width: 100%;
        background: #7e2714;
        padding: 15px;
        border: none;
        color: white;
        border-radius: 10px;
        font-size: 20px;
        margin-top: 10px;
        cursor: pointer;
      }

      .checkout-btn:hover {
        background: #e63939;
      }

      .clear-cart {
        width: 100%;
        background: #333;
        padding: 10px;
        border: none;
        color: white;
        border-radius: 10px;
        font-size: 16px;
        margin-top: 15px;
        cursor: pointer;
      }

      .clear-cart:hover {
        background: #e63939;
      }
    </style>
  </head>
  <body>
    <div class="page-layout">
      <div class="sidebar">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href="index.html"
              >Ana Sayfa <span class="sr-only"></span
            ></a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="urunlerDropdown"
              role="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Ürünlerimiz
            </a>
            <div class="dropdown-menu" aria-labelledby="urunlerDropdown">
              <a class="dropdown-item" href="test.html">Test Kitapları</a>
              <a class="dropdown-item" href="cocuk.html">Çocuk Kitapları</a>
              <a class="dropdown-item" href="roman.html">Roman</a>
            </div>
          </li>
          <!-- Birimlerimiz Dropdown -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="birimlerDropdown"
              role="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Birimlerimiz
            </a>
            <div class="dropdown-menu" aria-labelledby="birimlerDropdown">
              <a class="dropdown-item" href="musteri.html"
                >Müşteri Hizmetleri</a
              >
              <a class="dropdown-item" href="satis.html">Depo/Stok Yönetimi</a>
            </div>
          </li>
          <!-- Hakkımızda Dropdown -->
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="birimlerDropdown"
              role="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Hakkımızda
            </a>
            <div class="dropdown-menu" aria-labelledby="birimlerDropdown">
              <a class="dropdown-item" href="about.html">Biz Kimiz?</a>
              <a class="dropdown-item" href="misviz.html">Misyon-Vizyon</a>
              <a class="dropdown-item" href="sayi.html">Sayılarla Scala</a>
            </div>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">İletişim</a>
          </li>
        </ul>
      </div>

      <div class="cart-container">
        <h1>🛒 Sepetim</h1>

        <div id="cartItems"></div>

        <div class="summary">
          <div><span>Ara Toplam:</span> <span id="subTotal">0 TL</span></div>
          <div><span>KDV (%10):</span> <span id="tax">0 TL</span></div>
          <div style="font-weight: bold; font-size: 20px">
            <span>Genel Toplam:</span> <span id="grandTotal">0 TL</span>
          </div>

          <button class="checkout-btn">Satın Al</button>
          <button class="clear-cart" onclick="clearCart()">
            Sepeti Temizle
          </button>
        </div>
      </div>
    </div>
    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        const cartItemsDiv = document.getElementById("cartItems");
        cartItemsDiv.innerHTML = "";

        if (cart.length === 0) {
          cartItemsDiv.innerHTML = "<p>Sepetiniz boş.</p>";
          updateTotals();
          return;
        }

        cart.forEach((item, index) => {
          cartItemsDiv.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="">
            <div class="cart-info">
              <div class="cart-title">${item.name}</div>
              <div class="cart-price">${item.price} TL</div>

              <div class="quantity-controls">
                <button onclick="changeQty(${index}, -1)">-</button>
                <span>${item.quantity}</span>
                <button onclick="changeQty(${index}, 1)">+</button>
              </div>

              <button class="remove-btn" onclick="removeItem(${index})">Kaldır</button>
            </div>
          </div>
        `;
        });

        updateTotals();
      }

      function changeQty(i, amount) {
        cart[i].quantity += amount;
        if (cart[i].quantity < 1) cart[i].quantity = 1;
        saveCart();
      }

      function removeItem(i) {
        cart.splice(i, 1);
        saveCart();
      }

      function clearCart() {
        cart = [];
        saveCart();
      }

      function updateTotals() {
        let sub = cart.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0
        );
        let tax = sub * 0.1;
        let grand = sub + tax;

        document.getElementById("subTotal").innerText = sub.toFixed(2) + " TL";
        document.getElementById("tax").innerText = tax.toFixed(2) + " TL";
        document.getElementById("grandTotal").innerText =
          grand.toFixed(2) + " TL";
      }

      function saveCart() {
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      renderCart();
    </script>
    <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.js"></script>
    <script type="text/javascript" src="js/custom.js"></script>
    <script type="text/javascript" src="js/sepet.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
